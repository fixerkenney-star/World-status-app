name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          unzip -o StatusWorld-MVP.zip -d extracted
          ls -la extracted/
          cd extracted
          # find project folder
          PROJECT=$(find . -name "app" -type d | head -n 1 | xargs dirname)
          echo "Project at: $PROJECT"
          cd "$PROJECT"
          ls -la
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusWorld-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
