name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o StatusWorld-MVP.zip
          GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
          DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Found at $DIR"
          ls -la "$DIR"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          cd $PROJECT_DIR
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusWorld-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
