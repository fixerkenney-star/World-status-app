name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Fix old Kotlin code
        run: |
          unzip -o StatusWorld-MVP.zip -d extracted
          FILE=$(find extracted -name "build.gradle.kts" | grep app | head -n 1)
          echo "Fixing $FILE"
          sed -i '1i import org.jetbrains.kotlin.gradle.dsl.JvmTarget' "$FILE"
          sed -i 's/kotlinOptions/compilerOptions/g' "$FILE"
          sed -i 's/jvmTarget = "17"/jvmTarget.set(JvmTarget.JVM_17)/g' "$FILE"
          sed -i 's/jvmTarget = .17./jvmTarget.set(JvmTarget.JVM_17)/g' "$FILE"
          cat "$FILE"
      - name: Build APK
        run: |
          cd extracted
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusWorld-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
