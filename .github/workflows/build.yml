name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o StatusWorld-MVP.zip
          mv StatusWorld-MVP/* . 2>/dev/null || true
          mv StatusWorld-MVP/.* . 2>/dev/null || true
          rm -rf StatusWorld-MVP StatusWorld-MVP.zip
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusWorld-APK
          path: app/build/outputs/apk/debug/*.apk
